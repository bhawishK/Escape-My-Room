[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "escape-my-room"
version = "0.1.0"
description = "A connected WebXR diagnostic prototype"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pillow>=12,<13",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "websockets>=14,<17",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebook source: each cell imports what it needs.
"spikes/colmap-splat/room_splat.py" = ["E402"]
"spikes/colmap-splat/room_splat.ipynb" = ["E402"]
